# Conduit — one-command deployment.
#
#   docker compose up --build
#   -> frontend at http://localhost:8080  (nginx: SPA + proxies /rooms & /ws)
#   -> backend  at http://localhost:8787
#   -> postgres at localhost:5432 (internal — enable DATABASE_URL below for persistence)
#
# Startup order is enforced: db healthy -> db-init applies schema.sql ->
# backend starts -> frontend waits for the backend healthcheck.
#
# Deploying prebuilt images instead of building:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: conduit-frontend:local
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./server
    image: conduit-backend:local
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      # Enable Postgres persistence (the schema is applied by db-init before we start):
      # DATABASE_URL: postgres://conduit:conduit@db:5432/conduit
    ports:
      - "8787:8787"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Applies the schema once Postgres is healthy, then exits.
  # Idempotent (CREATE TABLE IF NOT EXISTS) — safe on every `up`.
  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: conduit
    volumes:
      - ./server/src/db/schema.sql:/schema.sql:ro
    entrypoint: ["psql", "-h", "db", "-U", "conduit", "-d", "conduit", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]
    restart: "no"

volumes:
  pgdata:
