# Conduit CI/CD pipeline.
#
#   push / PR          -> test, lint, build (frontend + backend)
#   push to main/tag   -> also build + push container images to GHCR
#   manual dispatch    -> deploy the images to a server over SSH (compose)
#
# Nothing runs until this repo is pushed to GitHub — the workflow file is
# ready to go (secrets: SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_DIR).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: Backend tests
        run: cd server && npm test

      - name: Build backend (tsc)
        run: cd server && npm run build

  docker:
    name: Build & push images
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

  deploy:
    name: Deploy to server
    # Images are already pushed by the docker job on every main push, so a
    # manual dispatch just pulls the latest and starts it — it must NOT need
    # the docker job (which is skipped on workflow_dispatch, which would skip
    # this job too).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: CONDUIT_FRONTEND_IMAGE,CONDUIT_BACKEND_IMAGE,GITHUB_TOKEN
          script: |
            set -e
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.DEPLOY_DIR }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
        env:
          # The prod compose override defaults to placeholder image names;
          # pass the real registry paths from this repo.
          CONDUIT_FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend:latest
          CONDUIT_BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
